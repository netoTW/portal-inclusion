# Entorno de desarrollo completo: `cp .env.example .env && docker compose up`.
# Nada requiere cloud. Las variables vienen de .env (ver .env.example);
# el `:?` corta con mensaje claro si falta el archivo.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copia .env.example a .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copia .env.example a .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copia .env.example a .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      # Contexto = raíz: la API orquesta módulos de /packages (arquitectura.md)
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # Dentro de la red de compose los hosts son los nombres de servicio.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/srv/api
      - ./packages:/srv/packages
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build: apps/web
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/srv/web
      # node_modules del contenedor, no del host (evita mezclar plataformas)
      - webmodules:/srv/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
  webmodules:
